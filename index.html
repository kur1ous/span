<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Drag the columns of a 2x2 matrix and watch the plane follow." />
    <title>span</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="sheet">
      <main class="plane-frame" id="plane-frame" aria-label="The plane">
        <!-- the plane svg is mounted here -->
      </main>

      <aside class="titleblock">
        <header class="cell brand">
          <h1>span</h1>
          <p>Drag the columns. Watch the plane follow.</p>
        </header>

        <div class="cell mode-tabs" role="tablist" aria-label="Mode">
          <button class="btn" id="mode-explore" type="button" role="tab" aria-selected="true" aria-controls="mode-panel">Explore</button>
          <button class="btn" id="mode-decompose" type="button" role="tab" aria-selected="false" aria-controls="mode-panel" tabindex="-1">Decompose</button>
        </div>

        <div id="mode-panel" role="tabpanel" aria-labelledby="mode-explore">
          <section class="cell" id="matrix-cell" aria-labelledby="matrix-label">
            <div class="cell-head">
              <h2 class="label" id="matrix-label">Transform</h2>
              <button class="btn" id="reset" type="button">Reset</button>
            </div>
            <div class="readout" id="matrix-readout"></div>
          </section>

          <section class="cell" id="det-cell" aria-labelledby="det-label">
            <h2 class="label" id="det-label">Determinant</h2>
            <div class="readout" id="det-readout"></div>
          </section>

          <section class="cell" id="eigen-cell" aria-labelledby="eigen-label">
            <h2 class="label" id="eigen-label">Eigenvalues &amp; unit eigenvectors</h2>
            <div class="readout" id="eigen-readout"></div>
          </section>

          <section class="cell" id="svd-cell" aria-labelledby="svd-label">
            <h2 class="label" id="svd-label">Singular value decomposition</h2>
            <div class="readout" id="svd-readout"></div>
          </section>

          <div class="cell">
            <fieldset class="overlays">
              <legend class="label">Overlays</legend>
              <div class="overlay-strip" id="overlay-strip"></div>
            </fieldset>
          </div>
        </div>

        <footer class="cell meta">
          <span>dwg. span</span>
          <span>rev. 0.1</span>
          <span>scale 1 : 1</span>
        </footer>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
